spring:
  application:
    name: hotel-pricing-ai-architect

  # Spring Boot 3.x 全局 HTTP 客户端超时配置 (会应用到 RestClient)
  http:
    client:
      read-timeout: 120s
      connect-timeout: 120s

  # Spring AI OpenAI 配置，对接学校的 PPIO 代理服务
  ai:
    openai:
      api-key: ${PPIO_API_KEY:sk_2TF1piK7-HUpkcITVUC5GyJPxOr3EeKZOupRvjAQqiM} # 课上生成的 API key 填在这里（或通过环境变量 PPIO_API_KEY 传入）
      base-url: https://api.ppio.com/openai
      chat:
        options:
          # 可选模型：
          # 1. "deepseek/deepseek-v4-pro" (推荐)
          # 2. "pa/gemini-3.1-pro-preview"
          # 3. "pa/gpt-5.4"
          model: pa/gpt-5.4
          temperature: 1.0

# 开启 Spring AI 日志
logging:
  level:
    org.springframework.ai: DEBUG
